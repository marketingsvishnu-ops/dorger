<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYLINE FITNESS | Rise Above</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#101c32;
  --blue:#3578f6;
  --sky:#9ecbff;
  --white:#f5f8fc;
  --muted:#7c899c;
  --line:#dce4ee;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Manrope,sans-serif;background:var(--white);color:var(--navy)}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
button{cursor:pointer}

nav{
  height:80px;position:fixed;top:0;left:0;width:100%;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 7%;background:#f5f8fced;backdrop-filter:blur(15px);
  border-bottom:1px solid #101c3210;
}
.logo{font-family:'Barlow Condensed';font-size:32px;font-weight:900;letter-spacing:1px}
.logo span{color:var(--blue)}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{font-size:11px;font-weight:800;letter-spacing:1px;transition:.3s}
.nav-links a:hover{color:var(--blue)}
.nav-cta{background:var(--blue);color:white!important;padding:14px 22px}
.menu{display:none;border:0;background:none;font-size:25px;color:var(--navy)}

.hero{
  min-height:760px;padding:150px 7% 100px;
  position:relative;overflow:hidden;display:flex;align-items:center;
  background:linear-gradient(110deg,#101c32 0%,#142b4e 58%,#2359a2 100%);
  color:white;
}
.hero-content{position:relative;z-index:3;max-width:690px}
.eyebrow{font-size:11px;letter-spacing:5px;color:#9ecbff;font-weight:800;margin-bottom:25px}
.hero h1{
  font-family:'Barlow Condensed';font-size:clamp(85px,13vw,165px);
  line-height:.8;letter-spacing:-2px;font-weight:900;
}
.hero h1 span{display:block;color:#80b8ff}
.hero p{max-width:450px;color:#c5d3e7;font-size:14px;line-height:1.9;margin:35px 0}
.btn{
  display:inline-block;padding:17px 28px;background:var(--blue);
  color:white;font-size:11px;font-weight:900;letter-spacing:2px;
  border:0;transition:.3s;
}
.btn:hover{background:white;color:var(--navy);transform:translateY(-4px)}
.hero-art{
  position:absolute;width:450px;height:450px;right:8%;top:19%;
  display:grid;place-items:center;
}
.sky-circle{
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#ffffff,#8fc6ff 20%,#3578f6 50%,#142b4e 80%);
  box-shadow:0 0 90px #4d9bff70, inset -25px -30px 55px #101c3270;
  animation:levitate 5s ease-in-out infinite;
}
.orbit{
  position:absolute;border:1px solid #9ecbff80;
  width:100%;height:40%;border-radius:50%;
  transform:rotate(-35deg);animation:orbit 12s linear infinite;
}
.orbit:nth-child(2){transform:rotate(45deg);width:85%;height:100%;animation-direction:reverse}
.orbit:nth-child(3){transform:rotate(75deg);width:65%;height:110%}
.orbit:after{
  content:"";position:absolute;top:15%;left:15%;
  width:13px;height:13px;border-radius:50%;background:white;
  box-shadow:0 0 20px #fff;
}
@keyframes levitate{50%{transform:translateY(-20px) scale(1.04)}}
@keyframes orbit{to{transform:rotate(325deg)}}
.hero-bottom{
  position:absolute;bottom:30px;left:7%;right:7%;
  display:flex;justify-content:space-between;
  color:#9eb1ce;font-size:10px;letter-spacing:3px;
}

.ticker{
  background:var(--blue);color:white;padding:24px 7%;
  display:flex;justify-content:space-around;gap:25px;flex-wrap:wrap;
  font-family:'Barlow Condensed';font-size:25px;font-weight:700;
  letter-spacing:2px;
}
section{padding:105px 7%}
.label{font-size:10px;letter-spacing:4px;font-weight:900;color:var(--blue);margin-bottom:16px}
.heading{
  font-family:'Barlow Condensed';font-size:clamp(50px,7vw,85px);
  line-height:.92;font-weight:900;text-transform:uppercase;
}
.desc{font-size:13px;line-height:1.9;color:var(--muted);max-width:410px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:50px}

/* PROGRAMS */
.programs{background:#fff}
.program-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.program{
  min-height:360px;padding:28px;background:#eaf1fa;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;transition:.3s;
}
.program:nth-child(2){background:#dce9ff}
.program:nth-child(3){background:#101c32;color:white}
.program:hover{transform:translateY(-8px)}
.program small{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--blue)}
.program .icon{
  font-size:95px;text-align:right;color:#3578f6;
  transition:.4s;
}
.program:hover .icon{transform:rotate(-12deg) scale(1.12)}
.program h3{font-family:'Barlow Condensed';font-size:40px;text-transform:uppercase}
.program p{font-size:12px;line-height:1.8;color:var(--muted);margin-top:10px}
.program:nth-child(3) p{color:#b7c5d9}

/* ABOUT */
.about{
  display:grid;grid-template-columns:1fr 1fr;gap:75px;align-items:center;
}
.about-art{
  min-height:480px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#dbeaff,#9bc3f6);
  display:grid;place-items:center;
}
.tower{
  width:175px;height:310px;position:relative;
  background:linear-gradient(90deg,#1c3152,#517eb6,#172c4b);
  transform:skewY(-7deg);
  box-shadow:25px 20px 50px #101c3240;
}
.tower:before{
  content:"";position:absolute;inset:15px;
  background:repeating-linear-gradient(0deg,transparent 0 24px,#9ecbff 25px 29px);
  opacity:.7;
}
.tower:after{
  content:"";position:absolute;top:-35px;left:50%;
  width:3px;height:35px;background:#172c4b;
}
.sun{
  position:absolute;width:160px;height:160px;border-radius:50%;
  background:#f4fbff;right:12%;top:13%;
  box-shadow:0 0 70px #fff;
}
.about-art span{
  position:absolute;bottom:25px;left:25px;
  font-size:10px;letter-spacing:3px;font-weight:900;color:#172c4b;
}
.about-copy p{font-size:13px;line-height:2;color:var(--muted);margin:25px 0}
.features{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}
.feature{border-top:1px solid var(--line);padding-top:15px}
.feature strong{display:block;font-family:'Barlow Condensed';font-size:32px;color:var(--blue)}
.feature span{font-size:10px;font-weight:800;letter-spacing:1px}

/* NUMBERS */
.numbers{
  background:var(--navy);color:white;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px;padding:50px 7%;
}
.number strong{font-family:'Barlow Condensed';font-size:55px;color:#80b8ff;display:block}
.number span{font-size:10px;letter-spacing:2px;color:#c3d2e8}

.plans{display:grid;grid-template-columns:
